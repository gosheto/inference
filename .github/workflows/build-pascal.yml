name: Build XInference Pascal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: xinference/deploy/docker/Dockerfile.pascal
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/xinference:v3.3.0-pascal-cu126
            ${{ vars.DOCKERHUB_USERNAME }}/xinference:stable-pascal
